<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="">
<title>Open Source Go Modules</title>
<link rel="shortcut icon" type="image/x-icon" href="https://go.dev/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #F7F7FB; --ink: #14162B; --body: #4C4F66; --mute: #63667F;
  --line: #E1E1EC; --accent: #2547E8; --code: #14162B; --code-ink: #EEEEF6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E0F1A; --ink: #EEEEF6; --body: #A2A5BC; --mute: #8A8DA6;
    --line: #22243A; --accent: #8AA8FF; --code: #191B2E; --code-ink: #EEEEF6;
  }
  .gopher { filter: saturate(.92) brightness(.94); }
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Outfit', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: none; }
a:hover { opacity: .7; }
.mark-link { text-decoration: none; padding-bottom: 1px; border-bottom: 1px solid var(--line); transition: border-bottom-width .2s cubic-bezier(.4,0,.2,1), border-color .2s cubic-bezier(.4,0,.2,1); }
.mark-link:hover { opacity: 1; color: var(--accent); border-bottom: 2px solid var(--accent); }
.mark-link.on-mute:hover { color: var(--mute); border-bottom: 2px solid var(--mute); }
.coffee-rail { display: flex; }
.coffee-inline { display: none; }
nav { width: 100%; max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 500; }
.split { flex: 1; min-height: 0; width: 100%; max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 288px 1fr; align-items: center; gap: 44px; padding: 72px 0; }
.split-copy { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; min-width: 0; }
.code-box { align-self: stretch; box-sizing: border-box; background: var(--code); border-radius: 16px; padding: 16px 20px; }
.code-box code { display: block; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14.5px; line-height: 1.5; color: var(--code-ink); white-space: nowrap; }
.split-p { margin: 0; max-width: 38ch; font-size: 18px; font-weight: 300; line-height: 1.7; color: var(--body); }
.render-footer { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 0 40px; display: flex; justify-content: center; font-size: 13.5px; font-weight: 300; color: var(--mute); }
@media (max-width: 900px) { .coffee-rail { display: none; } .coffee-inline { display: inline-flex; } }
@media (max-width: 680px) {
  .split { grid-template-columns: 1fr !important; grid-auto-rows: min-content; align-content: center; justify-items: center; gap: 24px !important; padding: 40px 0 !important; text-align: center; }
  .split .gopher { width: 208px !important; }
  .split-copy { align-items: center !important; }
}
</style>
</head>
<body>
<div style="background:var(--bg); color:var(--ink); min-height:100vh; padding:0 28px; display:flex; flex-direction:column">
<a class="coffee-rail" href="https://donate.nhat.me" target="_blank" rel="noopener noreferrer" style="position:fixed; right:20px; top:50%; transform:translateY(-50%); z-index:30; flex-direction:column; align-items:center; gap:8px; padding:16px 12px; border-radius:999px; background:var(--bg); border:1px solid var(--line); box-shadow:0 6px 20px rgba(20,22,43,.10); font-size:12px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent)">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z"></path><path d="M17 9h1.6a2.4 2.4 0 0 1 0 4.8H17"></path><path d="M7 4.5c0 .8.8 1 .8 1.8"></path><path d="M11 4c0 .9.9 1.2.9 2.1"></path></svg>
  <span style="writing-mode:vertical-rl">Buy me a coffee</span>
</a>

<nav>
  <a href="https://nhat.me">About me</a>
  <a href="https://go.nhat.io" style="color:var(--accent)">Go registry</a>
  <a href="https://fonts.nhat.io">Ligaturized fonts</a>
</nav>

<div class="split">
  <img class="gopher" src="https://raw.githubusercontent.com/nhatthm/govanityrender/master/resources/assets/404.svg" alt="A Go gopher, lost" style="width:100%; height:auto">
  <div class="split-copy">
    <h1 style="margin:0; font-size:52px; font-weight:600; line-height:1.05; letter-spacing:-0.04em">404</h1>
    <div class="code-box">
      <code>panic("DO NOT PANIC")</code>
    </div>
    <p class="split-p">What you're looking for may have been OOM killed.
      Do you want to see <a class="mark-link" href="https://go.nhat.io" style="color:var(--accent); font-weight:400">all the cool modules</a>?
    </p>
    <a class="coffee-inline" href="https://donate.nhat.me" target="_blank" rel="noopener noreferrer" style="padding:12px 24px; border-radius:999px; border:1px solid var(--line); font-size:15px; font-weight:500; color:var(--accent)">Buy me a coffee</a>
  </div>
</div>

<div class="render-footer">
  <span>Generated by <a class="mark-link on-mute" href="https://github.com/nhatthm/govanityrender" target="_blank" rel="noopener noreferrer" style="color:var(--mute)">vanityrender</a> v0.15.0</span>
</div>
</div>
</body>
</html>
